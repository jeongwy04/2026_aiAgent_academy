$kind: http-request
order: 15000
method: GET
url: '{{base_url}}/api/v1/tracks'
auth:
  type: bearer
  credentials:
  - key: token
    value: '{{bob_token}}'
scripts:
- type: afterResponse
  language: text/javascript
  code: 'pm.test(''HTTP 200'', () => pm.response.to.have.status(200));

    pm.test(''Private library'', () => pm.expect(pm.response.json().total).to.eql(0));'
