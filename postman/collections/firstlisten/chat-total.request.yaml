$kind: http-request
order: 11000
method: POST
url: '{{base_url}}/api/v1/chat'
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: "{\n  \"question\": \"이 노래 총 재생 시간이 얼마야?\",\n  \"track_id\": \"{{track_id}}\"\n}"
scripts:
- type: afterResponse
  language: text/javascript
  code: 'pm.test(''HTTP 200'', () => pm.response.to.have.status(200));

    pm.test(''Answered'', () => pm.expect(pm.response.json().status).to.eql(''answered''));

    pm.test(''Chat equals stats'', () => pm.expect(pm.response.json().total_listened_ms).to.eql(150000));'
